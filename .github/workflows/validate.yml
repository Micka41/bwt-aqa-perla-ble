name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Les deux actions ci-dessous suivent une branche, pas une version : leurs
  # règles évoluent sans que le dépôt change. Une exécution hebdomadaire signale
  # un durcissement avant qu'il ne bloque une publication.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hassfest
        uses: home-assistant/actions/hassfest@master
